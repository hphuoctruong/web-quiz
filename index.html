<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Quiz Platform</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a2332;
            --bg-card: #232f3e;
            --accent: #f0b429;
            --accent-glow: rgba(240, 180, 41, 0.3);
            --text-primary: #e8e6e3;
            --text-secondary: #9ca3af;
            --correct: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.15);
            --wrong: #ef4444;
            --wrong-bg: rgba(239, 68, 68, 0.1);
            --easy: #22c55e;
            --medium: #f59e0b;
            --hard: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(240, 180, 41, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                repeating-linear-gradient(45deg,
                    transparent,
                    transparent 100px,
                    rgba(255, 255, 255, 0.01) 100px,
                    rgba(255, 255, 255, 0.01) 101px);
            pointer-events: none;
            z-index: 0;
        }

        /* Page Transitions */
        .page {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Load Quiz Page Styles */
        .landing-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero-section h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-shadow: 0 0 40px var(--accent-glow);
        }

        .hero-section p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
        }

        .upload-card {
            background: var(--bg-card);
            border: 2px dashed rgba(240, 180, 41, 0.3);
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 4rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-card:hover {
            border-color: var(--accent);
            background: rgba(240, 180, 41, 0.05);
            transform: translateY(-5px);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
            display: block;
        }

        .upload-card input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .library-section {
            text-align: left;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .library-item {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .library-item:hover {
            background: var(--bg-card);
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .library-item h3 {
            color: var(--accent);
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
        }

        .library-item .meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        /* Play Quiz Page Styles */
        .main-layout {
            display: flex;
            height: 100vh;
        }

        .quiz-panel {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem 0;
        }

        .back-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 2rem;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--bg-secondary);
            padding: 0.5rem 1.25rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .stat-label {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent);
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .question-number {
            background: var(--bg-secondary);
            color: var(--accent);
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .difficulty-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .difficulty-Easy {
            background: rgba(34, 197, 94, 0.15);
            color: var(--easy);
        }

        .difficulty-Medium {
            background: rgba(245, 158, 11, 0.15);
            color: var(--medium);
        }

        .difficulty-Hard {
            background: rgba(239, 68, 68, 0.15);
            color: var(--hard);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .choice {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .choice:hover:not(.locked) {
            background: rgba(240, 180, 41, 0.05);
            border-color: rgba(240, 180, 41, 0.2);
        }

        .choice.correct {
            background: var(--correct-bg);
            border-color: var(--correct);
        }

        .choice.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong);
        }

        .choice-letter {
            background: rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .choice.correct .choice-letter {
            background: var(--correct);
            color: white;
        }

        .choice.wrong .choice-letter {
            background: var(--wrong);
            color: white;
        }

        .answer-reveal {
            margin-top: 1rem;
            padding: 1.25rem;
            background: rgba(16, 185, 129, 0.05);
            border-left: 4px solid var(--correct);
            border-radius: 0 12px 12px 0;
            display: none;
        }

        .answer-reveal.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .score-display {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            z-index: 100;
            width: 200px;
        }

        .score-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
        }

        .reset-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 0.75rem;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .youtube-panel {
            width: 450px;
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .youtube-panel.collapsed {
            width: 50px;
        }

        .youtube-panel.collapsed *:not(.youtube-toggle, .youtube-header) {
            display: none;
        }

        .youtube-header {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
        }

        .youtube-search {
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .youtube-search input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem;
            color: white;
            border-radius: 6px;
        }

        .youtube-search button {
            background: var(--accent);
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .youtube-frame {
            flex: 1;
            border: none;
            background: #000;
        }

        @media (max-width: 1000px) {
            .main-layout {
                flex-direction: column;
                height: auto;
            }

            .youtube-panel {
                width: 100%;
                height: 400px;
            }

            .score-display {
                position: static;
                width: 100%;
                margin-top: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>

    <!-- Load Quiz Page -->
    <div id="load-quiz-page" class="page active">
        <div class="landing-container">
            <div class="hero-section">
                <h1>EcoQuiz Master</h1>
                <p>Advanced Economics Learning Platform</p>
            </div>

            <div class="upload-card">
                <span class="upload-icon">📄</span>
                <h2>Upload Quiz Data</h2>
                <p>Drag & drop or click to upload a JSON quiz file</p>
                <input type="file" id="quiz-upload" accept=".json">
            </div>

            <div class="library-section">
                <h2 class="section-title">Quiz Library</h2>
                <div class="library-grid" id="library-grid">
                    <!-- Library items will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Play Quiz Page -->
    <div id="play-quiz-page" class="page">
        <div class="main-layout">
            <div class="quiz-panel">
                <div class="container">
                    <div class="back-nav">
                        <button class="back-btn" onclick="goToLibrary()">← Back to Library</button>
                    </div>

                    <header>
                        <h1 id="quiz-title">Economics Quiz</h1>
                        <div class="stats-bar">
                            <div class="stat">
                                <span class="stat-label">Total:</span>
                                <span class="stat-value" id="total-questions">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Answered:</span>
                                <span class="stat-value" id="answered-count">0</span>
                            </div>
                        </div>
                    </header>

                    <div class="filter-bar">
                        <button class="filter-btn active" data-filter="all">All Questions</button>
                        <button class="filter-btn" data-filter="Easy">Easy</button>
                        <button class="filter-btn" data-filter="Medium">Medium</button>
                        <button class="filter-btn" data-filter="Hard">Hard</button>
                    </div>

                    <div class="quiz-container" id="quiz-container"></div>
                </div>

                <div class="score-display">
                    <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 0.5rem;">PROGRESS</div>
                    <div class="score-value"><span id="correct-count">0</span> / <span id="attempted-count">0</span>
                    </div>
                    <button class="reset-btn" onclick="resetQuiz()">Restart Quiz</button>
                </div>
            </div>

            <div class="youtube-panel" id="youtube-panel">
                <div class="youtube-header">
                    <h3 style="color: var(--accent); font-family: 'Playfair Display'; font-size: 1rem;">Study Companion
                    </h3>
                    <button class="youtube-toggle" onclick="toggleYoutube()"
                        style="background: transparent; border: none; color: white; cursor: pointer;">◀</button>
                </div>
                <div class="youtube-search">
                    <input type="text" id="youtube-url" placeholder="Paste YouTube link...">
                    <button onclick="loadVideo()">Load</button>
                </div>
                <iframe class="youtube-frame" id="youtube-frame" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // Library Definition
        const library = [
            { id: 'ch1', title: 'Chapter 1: The Scope and Method of Economics', file: 'data_chapter1.json', icon: '📈' },
            { id: 'ch2', title: 'Chapter 2: The Economic Problem', file: 'data_chapter2.json', icon: '⚖️' },
            { id: 'ch5', title: 'Chapter 5: Introduction to Macroeconomics', file: 'data_chapter5.json', icon: '🌍' },
            { id: 'viet', title: 'Kinh tế học (Vietnamese)', file: 'data_vietnamese.json', icon: '🇻🇳' }
        ];

        let quizData = [];
        let correctCount = 0;
        let attemptedCount = 0;
        let answeredQuestions = new Set();
        let currentFilter = 'all';

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initLibrary();
            initEventListeners();
        });

        function initLibrary() {
            const grid = document.getElementById('library-grid');
            library.forEach(item => {
                const el = document.createElement('div');
                el.className = 'library-item';
                el.innerHTML = `
                    <div style="font-size: 2rem;">${item.icon}</div>
                    <h3>${item.title}</h3>
                    <div class="meta">
                        <span>${item.file}</span>
                        <span>Click to Start →</span>
                    </div>
                `;
                el.onclick = () => loadLibraryQuiz(item);
                grid.appendChild(el);
            });
        }

        function initEventListeners() {
            // File Upload
            document.getElementById('quiz-upload').addEventListener('change', handleFileUpload);

            // Filter Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderQuiz(currentFilter);
                };
            });

            // Youtube Enter
            document.getElementById('youtube-url').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadVideo();
            });
        }

        // --- Navigation ---
        function goToLibrary() {
            document.getElementById('play-quiz-page').classList.remove('active');
            document.getElementById('load-quiz-page').classList.add('active');
            window.scrollTo(0, 0);
        }

        function startQuiz(data, title) {
            quizData = data;
            document.getElementById('quiz-title').textContent = title;
            document.getElementById('load-quiz-page').classList.remove('active');
            document.getElementById('play-quiz-page').classList.add('active');

            // Reset state
            correctCount = 0;
            attemptedCount = 0;
            answeredQuestions.clear();
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));

            renderQuiz();
            window.scrollTo(0, 0);
        }

        // --- Data Loading ---
        async function loadLibraryQuiz(item) {
            try {
                const response = await fetch(item.file);
                if (!response.ok) throw new Error('Failed to load file');
                const data = await response.json();
                startQuiz(data, item.title);
            } catch (err) {
                alert('Error loading quiz: ' + err.message);
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (!Array.isArray(data)) throw new Error('Invalid quiz format');
                    startQuiz(data, file.name.replace('.json', ''));
                } catch (err) {
                    alert('Error parsing JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // --- Quiz Logic ---
        function renderQuiz(filter = 'all') {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            const filteredData = filter === 'all'
                ? quizData
                : quizData.filter(q => q.difficulty === filter);

            document.getElementById('total-questions').textContent = filteredData.length;

            filteredData.forEach((question, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.style.animationDelay = `${index * 0.05}s`;

                const isAnswered = answeredQuestions.has(question.id);
                const letters = ['A', 'B', 'C', 'D'];

                card.innerHTML = `
                    <div class="question-header">
                        <span class="question-number">#${question.id}</span>
                        <span class="difficulty-badge difficulty-${question.difficulty}">${question.difficulty}</span>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="choices" id="choices-${question.id}">
                        ${question.choices.map((choice, i) => `
                            <div class="choice ${isAnswered ? 'locked' : ''}" 
                                 onclick="handleChoice(this, ${question.id}, '${choice.replace(/'/g, "\\'")}')">
                                <span class="choice-letter">${letters[i]}</span>
                                <span class="choice-text">${choice}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="answer-reveal ${isAnswered ? 'show' : ''}" id="answer-${question.id}">
                        <div style="color: var(--correct); font-weight: 700; font-size: 0.8rem; margin-bottom: 0.25rem;">CORRECT SOLUTION</div>
                        <div class="answer-text">${question.solution}</div>
                    </div>
                `;

                container.appendChild(card);

                // If already answered, we need to highlight the correct/wrong choices
                if (isAnswered) {
                    // This is a simplified version; we don't store which choice was picked, 
                    // just that it was answered. For persistence, we'd need more state.
                    // For now, let's just highlight the correct one if answered.
                    const choices = card.querySelectorAll('.choice');
                    choices.forEach(c => {
                        if (c.querySelector('.choice-text').textContent === question.solution) {
                            c.classList.add('correct');
                        }
                    });
                }
            });

            updateStats();
        }

        function handleChoice(el, qId, selectedChoice) {
            if (answeredQuestions.has(qId)) return;

            const question = quizData.find(q => q.id === qId);
            answeredQuestions.add(qId);
            attemptedCount++;

            const isCorrect = selectedChoice === question.solution;
            if (isCorrect) {
                correctCount++;
                el.classList.add('correct');
            } else {
                el.classList.add('wrong');
                // Highlight correct
                const choices = el.parentElement.querySelectorAll('.choice');
                choices.forEach(c => {
                    if (c.querySelector('.choice-text').textContent === question.solution) {
                        c.classList.add('correct');
                    }
                });
            }

            // Lock all choices for this question
            el.parentElement.querySelectorAll('.choice').forEach(c => c.classList.add('locked'));

            // Show reveal
            document.getElementById(`answer-${qId}`).classList.add('show');
            updateStats();
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('attempted-count').textContent = attemptedCount;

            const filteredData = currentFilter === 'all'
                ? quizData
                : quizData.filter(q => q.difficulty === currentFilter);

            const answeredInFilter = filteredData.filter(q => answeredQuestions.has(q.id)).length;
            document.getElementById('answered-count').textContent = answeredInFilter;
        }

        function resetQuiz() {
            if (confirm('Are you sure you want to reset your progress for this quiz?')) {
                correctCount = 0;
                attemptedCount = 0;
                answeredQuestions.clear();
                renderQuiz(currentFilter);
            }
        }

        // --- Youtube ---
        function toggleYoutube() {
            const panel = document.getElementById('youtube-panel');
            const btn = panel.querySelector('.youtube-toggle');
            panel.classList.toggle('collapsed');
            btn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
        }

        function loadVideo() {
            const input = document.getElementById('youtube-url');
            const frame = document.getElementById('youtube-frame');
            const url = input.value.trim();

            let videoId = '';
            if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
            else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1];

            if (videoId) frame.src = `https://www.youtube.com/embed/${videoId}`;
            else alert('Invalid YouTube URL');
        }
    </script>
</body>

</html>
