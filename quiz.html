<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economics Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a2332;
            --bg-card: #232f3e;
            --accent: #f0b429;
            --accent-glow: rgba(240, 180, 41, 0.3);
            --text-primary: #e8e6e3;
            --text-secondary: #9ca3af;
            --correct: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.15);
            --wrong: #ef4444;
            --wrong-bg: rgba(239, 68, 68, 0.1);
            --easy: #22c55e;
            --medium: #f59e0b;
            --hard: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(240, 180, 41, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 100px,
                    rgba(255, 255, 255, 0.01) 100px,
                    rgba(255, 255, 255, 0.01) 101px
                );
            pointer-events: none;
            z-index: 0;
        }

        .main-layout {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .quiz-panel {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .youtube-panel {
            width: 400px;
            min-width: 300px;
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .youtube-header {
            padding: 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .youtube-header h3 {
            color: var(--accent);
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin: 0;
        }

        .youtube-toggle {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .youtube-toggle:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .youtube-search {
            padding: 0.75rem;
            display: flex;
            gap: 0.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .youtube-search input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
        }

        .youtube-search input::placeholder {
            color: var(--text-secondary);
        }

        .youtube-search button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .youtube-search button:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px var(--accent-glow);
        }

        .youtube-frame {
            flex: 1;
            border: none;
            background: #000;
        }

        .youtube-link {
            display: block;
            padding: 0.75rem;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
            background: var(--bg-card);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .youtube-link:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .youtube-panel.collapsed {
            width: 50px;
            min-width: 50px;
        }

        .youtube-panel.collapsed .youtube-header h3,
        .youtube-panel.collapsed .youtube-frame,
        .youtube-panel.collapsed .youtube-search,
        .youtube-panel.collapsed .youtube-link {
            display: none;
        }

        .youtube-panel.collapsed .youtube-header {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 1rem 0.5rem;
            height: 100%;
            justify-content: flex-start;
            gap: 1rem;
        }

        .youtube-panel.collapsed .youtube-toggle {
            writing-mode: horizontal-tb;
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
                height: auto;
            }

            .youtube-panel {
                width: 100%;
                height: 300px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .youtube-panel.collapsed {
                width: 100%;
                height: 50px;
            }

            .youtube-panel.collapsed .youtube-header {
                writing-mode: horizontal-tb;
                height: auto;
            }

            .quiz-panel {
                height: auto;
            }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .stat {
            background: var(--bg-secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-right: 0.5rem;
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent);
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                transform: translateY(10px);
            }
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .question-number {
            background: var(--bg-secondary);
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            min-width: 45px;
            text-align: center;
        }

        .difficulty-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .difficulty-Easy {
            background: rgba(34, 197, 94, 0.15);
            color: var(--easy);
        }

        .difficulty-Medium {
            background: rgba(245, 158, 11, 0.15);
            color: var(--medium);
        }

        .difficulty-Hard {
            background: rgba(239, 68, 68, 0.15);
            color: var(--hard);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .choice {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .choice:hover:not(.selected):not(.correct):not(.wrong) {
            background: rgba(240, 180, 41, 0.1);
            border-color: rgba(240, 180, 41, 0.3);
        }

        .choice-letter {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .choice-text {
            flex: 1;
            color: var(--text-primary);
        }

        .choice.correct {
            background: var(--correct-bg);
            border-color: var(--correct);
        }

        .choice.correct .choice-letter {
            background: var(--correct);
            color: white;
        }

        .choice.wrong {
            background: var(--wrong-bg);
            border-color: var(--wrong);
        }

        .choice.wrong .choice-letter {
            background: var(--wrong);
            color: white;
        }

        .answer-reveal {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--correct);
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .answer-reveal.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .answer-label {
            color: var(--correct);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .answer-text {
            color: var(--text-primary);
            font-weight: 500;
        }

        .score-display {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .reset-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .question-card {
                padding: 1.25rem;
            }

            .stats-bar {
                gap: 1rem;
            }

            .score-display {
                bottom: 1rem;
                left: 1rem;
                right: auto;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="main-layout">
        <div class="quiz-panel">
            <div class="container">
                <header>
                    <h1>Economics Quiz</h1>
                    <p class="subtitle">Test your knowledge of fundamental economic concepts</p>
                    <div class="stats-bar">
                        <div class="stat">
                            <span class="stat-label">Questions:</span>
                            <span class="stat-value" id="total-questions">50</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Answered:</span>
                            <span class="stat-value" id="answered-count">0</span>
                        </div>
                    </div>
                </header>

                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="Easy">Easy</button>
                    <button class="filter-btn" data-filter="Medium">Medium</button>
                    <button class="filter-btn" data-filter="Hard">Hard</button>
                </div>

                <div class="quiz-container" id="quiz-container"></div>
            </div>

            <div class="score-display">
        <div class="score-label">Your Score</div>
        <div class="score-value"><span id="correct-count">0</span> / <span id="attempted-count">0</span></div>
            <button class="reset-btn" onclick="resetQuiz()">Reset Quiz</button>
            </div>
        </div>

        <div class="youtube-panel" id="youtube-panel">
            <div class="youtube-header">
                <h3>YouTube</h3>
                <button class="youtube-toggle" onclick="toggleYoutube()">◀</button>
            </div>
            <div class="youtube-search">
                <input type="text" id="youtube-url" placeholder="Paste YouTube video URL..." />
                <button onclick="loadVideo()">Load</button>
            </div>
            <iframe class="youtube-frame" id="youtube-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <a class="youtube-link" href="https://www.youtube.com" target="_blank">Open YouTube in new tab ↗</a>
        </div>
    </div>

    <script>
        function toggleYoutube() {
            const panel = document.getElementById('youtube-panel');
            const btn = panel.querySelector('.youtube-toggle');
            panel.classList.toggle('collapsed');
            btn.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
        }

        function loadVideo() {
            const input = document.getElementById('youtube-url');
            const frame = document.getElementById('youtube-frame');
            const url = input.value.trim();
            
            // Extract video ID from various YouTube URL formats
            let videoId = '';
            if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(url.split('?')[1]);
                videoId = urlParams.get('v');
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('embed/')[1].split('?')[0];
            }
            
            if (videoId) {
                frame.src = `https://www.youtube.com/embed/${videoId}`;
            } else {
                alert('Please enter a valid YouTube URL');
            }
        }

        // Allow pressing Enter to load video
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('youtube-url').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadVideo();
            });
        });
        let quizData = [];

        let correctCount = 0;
        let attemptedCount = 0;
        let answeredQuestions = new Set();
        let currentFilter = 'all';

        function renderQuiz(filter = 'all') {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            const filteredData = filter === 'all' 
                ? quizData 
                : quizData.filter(q => q.difficulty === filter);

            document.getElementById('total-questions').textContent = filteredData.length;

            filteredData.forEach((question, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.dataset.id = question.id;

                const letters = ['A', 'B', 'C', 'D'];
                
                card.innerHTML = `
                    <div class="question-header">
                        <span class="question-number">#${question.id}</span>
                        <span class="difficulty-badge difficulty-${question.difficulty}">${question.difficulty}</span>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="choices">
                        ${question.choices.map((choice, i) => `
                            <div class="choice" data-choice="${choice}" data-question="${question.id}">
                                <span class="choice-letter">${letters[i]}</span>
                                <span class="choice-text">${choice}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="answer-reveal" id="answer-${question.id}">
                        <div class="answer-label">✓ Correct Answer</div>
                        <div class="answer-text">${question.solution}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Add click handlers
            document.querySelectorAll('.choice').forEach(choice => {
                choice.addEventListener('click', handleChoice);
            });

            updateStats();
        }

        function handleChoice(e) {
            const choiceEl = e.currentTarget;
            const questionId = parseInt(choiceEl.dataset.question);
            const selectedChoice = choiceEl.dataset.choice;
            const question = quizData.find(q => q.id === questionId);
            
            // If already answered, ignore
            if (answeredQuestions.has(questionId)) return;

            answeredQuestions.add(questionId);
            attemptedCount++;

            const isCorrect = selectedChoice === question.solution;
            if (isCorrect) {
                correctCount++;
                choiceEl.classList.add('correct');
            } else {
                choiceEl.classList.add('wrong');
                // Highlight correct answer
                const allChoices = document.querySelectorAll(`.choice[data-question="${questionId}"]`);
                allChoices.forEach(c => {
                    if (c.dataset.choice === question.solution) {
                        c.classList.add('correct');
                    }
                });
            }

            // Show answer reveal
            const answerReveal = document.getElementById(`answer-${questionId}`);
            answerReveal.classList.add('show');

            updateStats();
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('attempted-count').textContent = attemptedCount;
            
            const filteredData = currentFilter === 'all' 
                ? quizData 
                : quizData.filter(q => q.difficulty === currentFilter);
            
            const answeredInFilter = filteredData.filter(q => answeredQuestions.has(q.id)).length;
            document.getElementById('answered-count').textContent = answeredInFilter;
        }

        function resetQuiz() {
            correctCount = 0;
            attemptedCount = 0;
            answeredQuestions.clear();
            renderQuiz(currentFilter);
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderQuiz(currentFilter);
            });
        });

        // Load quiz data from JSON file and render
        async function loadQuizData() {
            try {
                const response = await fetch('data_vietnamese.json');
                quizData = await response.json();
                renderQuiz();
            } catch (error) {
                console.error('Error loading quiz data:', error);
                document.getElementById('quiz-container').innerHTML = 
                    '<p style="color: var(--wrong); text-align: center;">Failed to load quiz data. Please ensure data_vietnamese.json is available.</p>';
            }
        }

        // Initial load
        loadQuizData();
    </script>
</body>
</html>
